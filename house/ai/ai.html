<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آزمایشگاه هوشمند دکتر رضائی</title>
    
    <!-- بارگذاری pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        // تنظیم worker برای پردازش در مرورگر
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        console.log('✅ PDF.js loaded successfully');
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'IRANSans', 'Tahoma', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 3px solid #667eea;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #2d3748;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #718096;
            font-size: 1.1em;
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        @media (max-width: 968px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .section {
            background: #f7fafc;
            border-radius: 15px;
            padding: 20px;
            border: 1px solid #e2e8f0;
        }
        
        .section h2 {
            color: #2d3748;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .radio-player, .tv-player {
            background: #1a202c;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .radio-player audio, .tv-player video {
            width: 100%;
            border-radius: 8px;
        }
        
        .playlist {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        
        .playlist button {
            background: #4a5568;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .playlist button:hover {
            background: #667eea;
            transform: scale(1.05);
        }
        
        .playlist button.active {
            background: #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        
        .action-buttons button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 120px;
        }
        
        .action-buttons button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .items-grid {
            display: grid;
            gap: 15px;
            margin-top: 15px;
        }
        
        .item-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            border: 1px solid #e2e8f0;
            transition: all 0.3s;
        }
        
        .item-card:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }
        
        .item-card h3 {
            color: #2d3748;
            margin-bottom: 8px;
        }
        
        .item-card .meta {
            color: #718096;
            font-size: 0.9em;
            margin-bottom: 8px;
        }
        
        .item-card .description {
            color: #4a5568;
            margin-bottom: 10px;
        }
        
        .item-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .item-actions button {
            background: #edf2f7;
            border: 1px solid #e2e8f0;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
        }
        
        .item-actions button:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .knowledge-stats {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .knowledge-stats h3 {
            margin-bottom: 10px;
        }
        
        .knowledge-stats .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }
        
        .knowledge-stats .stat-item {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
        }
        
        .knowledge-stats .stat-number {
            font-size: 1.5em;
            font-weight: bold;
        }
        
        .knowledge-item {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #e2e8f0;
        }
        
        .knowledge-item h4 {
            color: #2d3748;
            margin-bottom: 8px;
        }
        
        .knowledge-item .meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            color: #718096;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        
        .knowledge-item .summary {
            background: #f7fafc;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
        }
        
        .knowledge-item .capabilities ul {
            list-style: none;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 8px 0;
        }
        
        .knowledge-item .capabilities li {
            background: #ebf8ff;
            color: #2b6cb0;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9em;
        }
        
        .knowledge-item .relations {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e2e8f0;
        }
        
        .knowledge-item .relations ul {
            list-style: none;
            margin: 8px 0;
        }
        
        .knowledge-item .relations li {
            color: #4a5568;
            font-size: 0.9em;
            padding: 4px 0;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-content h3 {
            margin-bottom: 15px;
        }
        
        .modal-content input,
        .modal-content textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-family: inherit;
        }
        
        .modal-content textarea {
            min-height: 100px;
        }
        
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .modal-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .modal-actions .submit-btn {
            background: #667eea;
            color: white;
        }
        
        .modal-actions .cancel-btn {
            background: #e2e8f0;
            color: #4a5568;
        }
        
        .modal-actions button:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🧠 آزمایشگاه هوشمند دکتر رضائی</h1>
            <p>رادیوتلویزیون مبتنی بر دانش - پردازش هوشمند مقالات، کتاب‌ها و پوسترها</p>
        </div>
        
        <!-- Main Grid -->
        <div class="main-grid">
            <!-- Radio Section -->
            <div class="section">
                <h2>📻 رادیو هوشمند</h2>
                <div class="radio-player">
                    <audio id="radioPlayer" controls style="width: 100%;">
                        <source src="" type="audio/mpeg">
                        مرورگر شما از پخش صدا پشتیبانی نمی‌کند.
                    </audio>
                </div>
                <div class="playlist" id="radioPlaylist">
                    <button data-audio="/ghrezaei1399.github.io/house/ai/audio1.mp3.mp3" class="active">🎵 ترک ۱</button>
                    <button data-audio="/ghrezaei1399.github.io/house/ai/audio2.mp3.mp3">🎵 ترک ۲</button>
                </div>
                <div class="action-buttons">
                    <button onclick="openModal('request')">📥 درخواست فایل</button>
                    <button onclick="openModal('voice')">🎤 ارسال ویس</button>
                    <button onclick="shareContent()">🔗 اشتراک</button>
                </div>
            </div>
            
            <!-- TV Section -->
            <div class="section">
                <h2>📺 تلویزیون هوشمند</h2>
                <div class="tv-player">
                    <video id="tvPlayer" controls style="width: 100%;">
                        <source src="" type="video/mp4">
                        مرورگر شما از پخش ویدیو پشتیبانی نمی‌کند.
                    </video>
                </div>
                <div class="playlist" id="tvPlaylist">
                    <button data-video="/ghrezaei1399.github.io/house/ai/video1.mp4.mp4" class="active">🎬 ویدیو ۱</button>
                    <button data-video="/ghrezaei1399.github.io/house/ai/video2.mp4.mp4">🎬 ویدیو ۲</button>
                </div>
                <div class="action-buttons">
                    <button onclick="openModal('video')">📤 ارسال ویدیو</button>
                    <button onclick="openModal('comment')">💬 نظر</button>
                    <button onclick="shareContent()">🔗 اشتراک</button>
                </div>
            </div>
        </div>
        
        <!-- Knowledge Section -->
        <div class="section" style="margin-bottom: 30px;">
            <h2>🧠 دانش هوشمند</h2>
            <div id="knowledge-container">
                <!-- Knowledge will be displayed here -->
            </div>
        </div>
        
        <!-- Books and Posters Grid -->
        <div class="main-grid">
            <!-- Books Section -->
            <div class="section">
                <h2>📚 کتاب‌ها</h2>
                <div class="items-grid" id="booksContainer">
                    <!-- Books will be loaded from library.json -->
                </div>
            </div>
            
            <!-- Posters Section -->
            <div class="section">
                <h2>🎨 پوسترها</h2>
                <div class="items-grid" id="postersContainer">
                    <!-- Posters will be loaded from library.json -->
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h3 id="modalTitle">ارسال درخواست</h3>
            <form id="modalForm">
                <input type="text" id="modalName" placeholder="نام شما" required>
                <input type="email" id="modalEmail" placeholder="ایمیل شما" required>
                <textarea id="modalMessage" placeholder="پیام شما..."></textarea>
                <input type="file" id="modalFile" accept="audio/*,video/*" style="display:none;">
                <div class="modal-actions">
                    <button type="submit" class="submit-btn">ارسال</button>
                    <button type="button" class="cancel-btn" onclick="closeModal()">لغو</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="/ghrezaei1399.github.io/house/ai/library.json" id="libraryData"></script>
    <script src="/ghrezaei1399.github.io/house/ai/extractors.js"></script>
    <script src="/ghrezaei1399.github.io/house/ai/knowledge-builder.js"></script>
    <script src="/ghrezaei1399.github.io/house/ai/pdf-reader.js"></script>
    <script src="/ghrezaei1399.github.io/house/ai/article-agent.js"></script>
    <script src="/ghrezaei1399.github.io/house/ai/process-articles.js"></script>
    <script src="/ghrezaei1399.github.io/house/ai/brain.js"></script>
    <script src="/ghrezaei1399.github.io/house/ai/ui-display.js"></script>
    <script src="/ghrezaei1399.github.io/house/ai/radio-tv.js"></script>
    <script src="/ghrezaei1399.github.io/house/ai/intelligent-agent.js"></script>
    
    <script>
        // Global functions for UI
        let currentModalType = '';
        
        function openModal(type) {
            currentModalType = type;
            const modal = document.getElementById('modal');
            const title = document.getElementById('modalTitle');
            const fileInput = document.getElementById('modalFile');
            
            switch(type) {
                case 'request':
                    title.textContent = '📥 درخواست فایل جدید';
                    fileInput.style.display = 'none';
                    break;
                case 'voice':
                    title.textContent = '🎤 ارسال ویس';
                    fileInput.style.display = 'block';
                    fileInput.accept = 'audio/*';
                    break;
                case 'video':
                    title.textContent = '📤 ارسال ویدیو';
                    fileInput.style.display = 'block';
                    fileInput.accept = 'video/*';
                    break;
                case 'comment':
                    title.textContent = '💬 ارسال نظر';
                    fileInput.style.display = 'none';
                    break;
            }
            
            modal.classList.add('show');
        }
        
        function closeModal() {
            document.getElementById('modal').classList.remove('show');
            document.getElementById('modalForm').reset();
        }
        
        function shareContent() {
            if (navigator.share) {
                navigator.share({
                    title: 'آزمایشگاه هوشمند دکتر رضائی',
                    text: 'به آزمایشگاه هوشمند دکتر رضائی خوش آمدید',
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    alert('🔗 لینک کپی شد!');
                }).catch(() => {
                    alert('🔗 لینک: ' + window.location.href);
                });
            }
        }
        
        // Radio and TV controls
        document.addEventListener('DOMContentLoaded', function() {
            // Radio playlist
            const radioButtons = document.querySelectorAll('#radioPlaylist button');
            const radioPlayer = document.getElementById('radioPlayer');
            
            radioButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    radioButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    radioPlayer.src = this.dataset.audio;
                    radioPlayer.load();
                    radioPlayer.play();
                });
            });
            
            // TV playlist
            const tvButtons = document.querySelectorAll('#tvPlaylist button');
            const tvPlayer = document.getElementById('tvPlayer');
            
            tvButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    tvButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    tvPlayer.src = this.dataset.video;
                    tvPlayer.load();
                    tvPlayer.play();
                });
            });
            
            // Load initial media
            if (radioButtons.length > 0) {
                radioButtons[0].click();
            }
            if (tvButtons.length > 0) {
                tvButtons[0].click();
            }
            
            // Modal form submission
            document.getElementById('modalForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const name = document.getElementById('modalName').value;
                const email = document.getElementById('modalEmail').value;
                const message = document.getElementById('modalMessage').value;
                const file = document.getElementById('modalFile').files[0];
                
                alert(`✅ درخواست شما با موفقیت ارسال شد!\n\nنام: ${name}\nایمیل: ${email}\nپیام: ${message || 'بدون پیام'}\nفایل: ${file ? file.name : 'بدون فایل'}`);
                
                closeModal();
                
                // Here you can send to server or save to localStorage
                const requestData = {
                    type: currentModalType,
                    name: name,
                    email: email,
                    message: message,
                    file: file ? file.name : null,
                    timestamp: new Date().toISOString()
                };
                
                // Save to localStorage
                let requests = JSON.parse(localStorage.getItem('userRequests') || '[]');
                requests.push(requestData);
                localStorage.setItem('userRequests', JSON.stringify(requests));
            });
            
            // Load library data and initialize brain
            fetch('/ghrezaei1399.github.io/house/ai/library.json')
                .then(response => response.json())
                .then(data => {
                    window.libraryData = data;
                    displayItems(data.books || [], 'booksContainer', 'book');
                    displayItems(data.posters || [], 'postersContainer', 'poster');
                    
                    // Initialize brain after library data is loaded
                    if (typeof brain !== 'undefined') {
                        brain.initialize();
                    }
                })
                .catch(error => {
                    console.error('Error loading library:', error);
                });
        });
        
        function displayItems(items, containerId, type) {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            if (!items || items.length === 0) {
                container.innerHTML = '<p style="color: #718096;">هیچ موردی یافت نشد</p>';
                return;
            }
            
            container.innerHTML = items.map(item => `
                <div class="item-card">
                    <h3>${item.title}</h3>
                    <div class="meta">نویسنده: ${item.author || 'ناشناس'} | سال: ${item.year || 'نامشخص'}</div>
                    <div class="description">${item.description || 'توضیحات در دسترس نیست'}</div>
                    ${item.price ? `<div class="meta">💰 قیمت: ${item.price}</div>` : ''}
                    ${item.publisher ? `<div class="meta">📚 ناشر: ${item.publisher}</div>` : ''}
                    <div class="item-actions">
                        <button onclick="handleAction('buy', '${item.id}')">🛒 درخواست خرید</button>
                        <button onclick="handleAction('comment', '${item.id}')">💬 نظر</button>
                        ${item.path ? `<button onclick="handleAction('download', '${item.id}')">📥 دانلود</button>` : ''}
                    </div>
                </div>
            `).join('');
        }
        
        function handleAction(action, id) {
            switch(action) {
                case 'buy':
                    alert(`🛒 درخواست خرید برای آیتم ${id} ارسال شد.`);
                    break;
                case 'comment':
                    openModal('comment');
                    break;
                case 'download':
                    alert(`📥 دانلود آیتم ${id} شروع شد.`);
                    break;
                default:
                    alert(`عملیات ${action} برای آیتم ${id} انجام شد.`);
            }
        }
        
        // Close modal on outside click
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
        
        console.log('✅ AI Lab loaded successfully!');
    </script>
</body>
</html>
