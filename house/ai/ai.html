<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>رادیو تلویزیون هوشمند دکتر رضائی</title>
    <style>
        /* استایل‌های قبلی با اضافه شدن بخش‌های رادیو و تلویزیون */
        .radio-tv-container {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            margin: 25px 0;
        }
        .radio-box, .tv-box {
            flex: 1;
            min-width: 300px;
            background: #0b1f2c;
            border-radius: 20px;
            padding: 20px;
            color: white;
            border: 2px solid #f7c948;
        }
        .radio-box h2, .tv-box h2 {
            color: #f7c948;
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .radio-player, .tv-player {
            width: 100%;
            border-radius: 12px;
            background: #000;
            margin: 10px 0;
        }
        .tv-player {
            max-height: 300px;
        }
        .radio-player {
            max-height: 60px;
        }
        .interact-radio-tv {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }
        .interact-radio-tv button {
            background: #f7c948;
            border: none;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #0b3d5c;
            cursor: pointer;
        }
        .interact-radio-tv button:hover {
            background: #f5c542;
        }
        .radio-wave {
            display: flex;
            justify-content: center;
            gap: 4px;
            height: 30px;
            margin: 5px 0;
        }
        .wave-bar {
            width: 4px;
            background: #f7c948;
            border-radius: 2px;
            animation: wave 0.8s infinite alternate;
        }
        @keyframes wave {
            0% { height: 5px; }
            100% { height: 25px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <!-- هدر با تصویر و عنوان -->
    </div>
    <div class="content">
        <div id="brain-status">در حال راه‌اندازی...</div>

        <!-- بخش رادیو و تلویزیون -->
        <div class="radio-tv-container">
            <!-- رادیو -->
            <div class="radio-box">
                <h2>📻 رادیو هوشمند</h2>
                <audio id="radioPlayer" class="radio-player" controls>
                    <source src="#" type="audio/mpeg">
                </audio>
                <div class="radio-wave" id="radioWave">
                    <div class="wave-bar" style="animation-delay:0s"></div>
                    <div class="wave-bar" style="animation-delay:0.1s"></div>
                    <div class="wave-bar" style="animation-delay:0.2s"></div>
                    <div class="wave-bar" style="animation-delay:0.3s"></div>
                    <div class="wave-bar" style="animation-delay:0.4s"></div>
                    <div class="wave-bar" style="animation-delay:0.5s"></div>
                </div>
                <p id="radioNowPlaying">در حال پخش: قطع نشده</p>
                <div class="interact-radio-tv">
                    <button onclick="RadioTV.requestRadioSong()">🎵 درخواست آهنگ</button>
                    <button onclick="RadioTV.radioComment()">🎤 نظر صوتی</button>
                    <button onclick="RadioTV.shareRadio()">📤 اشتراک</button>
                </div>
            </div>

            <!-- تلویزیون -->
            <div class="tv-box">
                <h2>📺 تلویزیون هوشمند</h2>
                <video id="tvPlayer" class="tv-player" controls>
                    <source src="#" type="video/mp4">
                </video>
                <p id="tvNowPlaying">در حال پخش: قطع نشده</p>
                <div class="interact-radio-tv">
                    <button onclick="RadioTV.requestTvShow()">🎬 درخواست فیلم</button>
                    <button onclick="RadioTV.tvComment()">📝 نظر تصویری</button>
                    <button onclick="RadioTV.shareTv()">📤 اشتراک</button>
                </div>
            </div>
        </div>

        <!-- بخش تعامل مخاطب (ارسال متن، ویس، ویدیو) -->
        <div style="background:#f5faff; padding:20px; border-radius:20px; margin:20px 0; border:1px solid #dce6ef;">
            <h3 style="color:#0b3d5c; margin-top:0;">💬 تعامل با رادیو/تلویزیون</h3>
            <div style="display:flex; flex-wrap:wrap; gap:10px;">
                <button onclick="RadioTV.sendText()" class="btn btn-primary">✍️ ارسال متن</button>
                <button onclick="RadioTV.sendVoice()" class="btn btn-primary" style="background:#e67e22;">🎤 ارسال ویس</button>
                <button onclick="RadioTV.sendVideo()" class="btn btn-primary" style="background:#c0392b;">📹 ارسال ویدیو</button>
            </div>
            <div id="interactionResponse" style="margin-top:15px; padding:10px; background:white; border-radius:12px; min-height:40px;"></div>
        </div>

        <!-- سایر بخش‌های قبلی (مقالات، آمار، گراف) -->
        <div id="articles-container"></div>
        <div id="statistics-container"></div>
        <div id="graph-container"></div>

        <!-- باکس اطلاعات تماس -->
        <div class="contact-box">
            <h3>📬 ارتباط با دکتر رضائی</h3>
            <div class="contact-info">
                <span>📧 <strong>ایمیل:</strong> ghrezaei1399@gmail.com</span>
                <span>🔗 <strong>لینکدین:</strong> <a href="https://www.linkedin.com/in/rezaei-researcher" target="_blank">linkedin.com/in/rezaei-researcher</a></span>
                <span>📚 <strong>سایت اصلی:</strong> <a href="https://ghrezaei1399-code.github.io/ghrezaei1399.github.io/" target="_blank">مشاهده</a></span>
            </div>
        </div>

        <!-- بخش فنی -->
        <details class="technical-info">
            <summary>وضعیت فنی</summary>
            <div id="technical-details"></div>
        </details>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-parse/1.1.1/pdf-parse.min.js"></script>
<script src="./storage.js"></script>
<script src="./self-healing.js"></script>
<script src="./ui-display.js"></script>
<script src="./handler.js"></script>
<script src="./knowledge-builder.js"></script>
<script src="./article-agent.js"></script>
<script src="./graph.js"></script>
<script src="./relation-agent.js"></script>
<script src="./migration-agent.js"></script>
<script src="./brain.js"></script>
<script src="./radio-tv.js"></script>

</body>
</html>
